<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zyntra History</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/topbar.css') }}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css"></head><body>{% include "includes/sidebar.html" %}{% include "includes/topbar.html" %}<main style="margin-left:260px;padding:100px 25px 35px;min-height:100vh"><div style="max-width:1000px;margin:auto;background:rgba(15,23,42,.65);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:25px;color:#fff"><h1 style="margin-top:0">AI Creation History</h1>{% if history %}{% for item in history %}<article style="padding:15px 0;border-bottom:1px solid rgba(255,255,255,.08)"><strong>{{ item.title }}</strong><div style="color:#94a3b8;font-size:12px;margin-top:5px">{{ item.type }} · {{ item.provider }} · {{ item.date }}</div></article>{% endfor %}{% else %}<p style="color:#94a3b8">No history yet.</p>{% endif %}</div></main></body></html>
