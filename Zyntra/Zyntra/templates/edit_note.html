<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Edit Note</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/notes.css') }}">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/topbar.css') }}">


</head>

<body>

    {% include "includes/topbar.html" %}
    
<div class="container">

    <h1>Edit Note</h1>

    <div class="add-note">

        <form method="POST">

            <input
                type="text"
                name="title"
                value="{{ note.title }}"
                required>

            <textarea
                name="description"
                required>{{ note.description }}</textarea>

            <button type="submit">
                <i class="fa-solid fa-floppy-disk"></i>
                Update Note
            </button>

        </form>

    </div>

    <a href="/notes" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
        Back to Notes
    </a>

</div>

</body>

</html>
