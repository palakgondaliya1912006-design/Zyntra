<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup - Zyntra</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>
<nav class="navbar">

   <div class="logo">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Zyntra Logo">

   
</div>

    <ul>

        <li><a href="/">Home</a></li>

        <li><a href="/login">Login</a></li>

        <li><a href="/signup">Signup</a></li>

    </ul>

</nav>

<div class="login-container">

    <div class="login-left">
        <img src="{{ url_for('static', filename='images/login.png') }}" alt="">
    </div>


    <div class="login-right">

        <form method="POST">

            <h2><B>Welcome to Zyntra</B><br>start your smart workspace</h2>

            <input type="text" name="fullname" placeholder="Full Name" required>
            
            <input type="email" name="email" placeholder="Enter Your Email" required>
            <div class="password-box">

                <input type="password" name="password" id="password" placeholder="Password" required>

                <i class="fa-solid fa-eye" id="togglePassword"></i>

            </div>

            <div class="password-box">

                <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm Password" required>


                <i class="fa-solid fa-eye" id="toggleConfirm"></i>

            </div>

            <button type="submit">Create Account</button>

            <p>

                Already have an account?

                <a href="/login">Login</a>

            </p>

        </form>

    </div>

</div>

<script>

const password=document.getElementById("password");
const togglePassword=document.getElementById("togglePassword");

togglePassword.onclick=function(){

    if(password.type==="password"){

        password.type="text";

        togglePassword.classList.replace("fa-eye","fa-eye-slash");

    }

    else{

        password.type="password";

        togglePassword.classList.replace("fa-eye-slash","fa-eye");

    }

}


const confirm=document.getElementById("confirmPassword");
const toggleConfirm=document.getElementById("toggleConfirm");

toggleConfirm.onclick=function(){

    if(confirm.type==="password"){

        confirm.type="text";

        toggleConfirm.classList.replace("fa-eye","fa-eye-slash");

    }

    else{
        confirm.type="password";

        toggleConfirm.classList.replace("fa-eye-slash","fa-eye");

    }

}

</script>

</body>

</html>
